<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>⚔️ THE FORGE — Battle Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="battle.css" />
  <style>
    body{margin:0;background:#0b0a12;color:#f2edff;font-family:'VT323',monospace;min-height:100vh;display:grid;place-items:center;text-align:center}
    h1{font-family:'Press Start 2P',sans-serif;color:#ffd662;font-size:1.2rem}
    .pick{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:16px}
    .pk{width:150px;background:#1a1728;border:2px solid #3a3252;border-radius:12px;padding:14px;color:#f2edff;font-family:'VT323',monospace;font-size:1.2rem}
    .pk b{font-family:'Press Start 2P',sans-serif;font-size:.7rem;display:block;margin-bottom:6px}
    label{font-size:1.3rem} input{width:70px;font-family:'VT323';font-size:1.2rem;background:#12101e;color:#fff;border:2px solid #3a3252;border-radius:6px;padding:4px}
  </style>
</head>
<body>
  <div id="menu">
    <h1>⚔️ BATTLE TEST</h1>
    <p>Pick a hero. Move: drag left stick / WASD · Attack: ATK / J · Dodge: DODGE / K</p>
    <div class="pick" id="pick"></div>
    <label>Quest difficulty (0–16): <input id="qi" type="number" value="0" min="0" max="16" /></label>
  </div>

  <script src="battle-data.js"></script>
  <script src="terrain.js"></script>
  <script src="battle.js"></script>
  <script>
    const pick = document.getElementById('pick');
    for (const [id, c] of Object.entries(window.BATTLE.CLASSES)) {
      const b = document.createElement('button'); b.className = 'pk';
      b.innerHTML = `<b style="color:${c.color}">${c.name}</b>${c.klass}<br>HP ${c.base.hp} · ATK ${c.base.atk}<br>ARM ${c.base.armor} · SPD ${c.base.speed}`;
      b.onclick = () => {
        const qi = Math.max(0, Math.min(16, +document.getElementById('qi').value || 0));
        document.getElementById('menu').style.display = 'none';
        window.ForgeBattle.start({ classId: id, questIndex: qi,
          onWin: (res) => { alert(`Victory! +${res.xp} XP\nLoot: ` + (res.loot.map(i => window.BATTLE.GEAR[i].name).join(', ') || 'none')); document.getElementById('menu').style.display = ''; },
          onExit: () => { document.getElementById('menu').style.display = ''; } });
      };
      pick.appendChild(b);
    }
  </script>
</body>
</html>
