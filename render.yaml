# Render Blueprint — deploys the Forge RPG app for free.
# One-click: https://render.com/deploy?repo=https://github.com/kaleinoue/For-the-boys
# Then paste your keys (GEMINI_API_KEY, TURSO_*) in the Render dashboard.
services:
  - type: web
    name: the-forge
    runtime: node
    rootDir: forge-app
    plan: free
    buildCommand: npm install   # no dependencies — effectively a no-op
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false             # set in dashboard (secret)
      # Routing grading through a gateway (OmniRoute / LiteLLM / OpenRouter)? Set all
      # three, plus FORGE_MODELS to the gateway's model names. FORGE_BYOK=0 hides the
      # in-app key panel, which a gateway would reject anyway. See README "AI grading".
      - key: GEMINI_API_BASE
        sync: false
      - key: GEMINI_API_STYLE
        sync: false
      - key: FORGE_BYOK
        sync: false
      - key: FORGE_MODELS
        sync: false
      # Shared progress. Render's free disk is wiped on restart, so set these —
      # the server creates its own tables on first boot.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Legacy alternative: only used when the TURSO_* values above are blank.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
